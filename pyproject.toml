[project]
name = "jd-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sipica", email = "sipica@get-capital.de" }
]
requires-python = ">=3.13.7"
dependencies = [
    "anthropic>=0.109.1",
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.197.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "isort>=8.0.1",
    "jinja2>=3.1.6",
    "mlflow>=3.14.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
jd-analyser = "jd_analyser:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
